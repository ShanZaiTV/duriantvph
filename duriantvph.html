```html
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport"
      content="width=device-width, initial-scale=1.0">

<title>DuriantvPH IPTV Player</title>

<script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>

<style>
* {
    box-sizing: border-box;
}

html, body {
    margin: 0;
    width: 100%;
    height: 100%;
    background: #000;
    color: #fff;
    font-family: Arial, sans-serif;
}

body {
    display: flex;
    flex-direction: column;
}

.header {
    height: 55px;
    background: #111;
    display: flex;
    align-items: center;
    padding: 0 15px;
    font-size: 20px;
    font-weight: bold;
}

.header span {
    color: #00e5ff;
}

.player {
    position: relative;
    width: 100%;
    background: #000;
    aspect-ratio: 16 / 9;
}

video {
    width: 100%;
    height: 100%;
    display: block;
    background: #000;
}

.loading {
    position: absolute;
    inset: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    background: rgba(0,0,0,.65);
    z-index: 5;
}

.loading.hide {
    display: none;
}

.spinner {
    width: 38px;
    height: 38px;
    border: 4px solid #444;
    border-top-color: #00e5ff;
    border-radius: 50%;
    animation: spin 1s linear infinite;
}

@keyframes spin {
    to {
        transform: rotate(360deg);
    }
}

.info {
    padding: 12px 15px;
    background: #111;
}

.title {
    font-size: 17px;
    font-weight: bold;
}

.live {
    color: #00e676;
    font-size: 13px;
    margin-top: 4px;
}

.buttons {
    display: flex;
    gap: 8px;
    padding: 10px;
    background: #111;
}

button {
    flex: 1;
    border: 0;
    border-radius: 7px;
    padding: 11px;
    background: #222;
    color: #fff;
    font-size: 14px;
}

button:active {
    background: #00bcd4;
    color: #000;
}

.error {
    color: #ff5252;
    padding: 10px 15px;
    background: #111;
    font-size: 13px;
}

@media (min-width: 800px) {
    .player {
        max-width: 1100px;
        margin: auto;
    }

    .info,
    .buttons,
    .error {
        max-width: 1100px;
        width: 100%;
        margin: auto;
    }
}
</style>
</head>

<body>

<div class="header">
    Duriantv<span>PH</span>
</div>

<div class="player" id="player">

    <div class="loading" id="loading">
        <div class="spinner"></div>
    </div>

    <video
        id="video"
        controls
        playsinline
        webkit-playsinline
        preload="auto">
    </video>

</div>

<div class="info">
    <div class="title">📺 DuriantvPH Live TV</div>
    <div class="live" id="status">
        ● Connecting...
    </div>
</div>

<div class="buttons">
    <button onclick="playStream()">▶ Play</button>
    <button onclick="reloadStream()">↻ Reload</button>
    <button onclick="fullscreen()">⛶ Fullscreen</button>
</div>

<div class="error" id="error"></div>

<script>

const STREAM_URL =
"https://duriantvph.itunerworldwide.workers.dev/master.live.m3u8";

const video = document.getElementById("video");
const loading = document.getElementById("loading");
const status = document.getElementById("status");
const errorBox = document.getElementById("error");

let hls = null;

function setStatus(text, live = false) {
    status.textContent = text;
    status.style.color = live ? "#00e676" : "#aaa";
}

function hideLoading() {
    loading.classList.add("hide");
}

function showLoading() {
    loading.classList.remove("hide");
}

function showError(text) {
    errorBox.textContent = text;
}

function clearError() {
    errorBox.textContent = "";
}

function destroyHLS() {
    if (hls) {
        hls.destroy();
        hls = null;
    }
}

function playStream() {

    clearError();
    showLoading();
    setStatus("● Connecting...", false);

    destroyHLS();

    /*
     * Chrome / Android / Firefox / Edge
     */
    if (Hls.isSupported()) {

        hls = new Hls({
            enableWorker: true,
            lowLatencyMode: true,
            liveDurationInfinity: true,
            maxBufferLength: 20,
            backBufferLength: 10
        });

        hls.loadSource(STREAM_URL);
        hls.attachMedia(video);

        hls.on(
            Hls.Events.MANIFEST_PARSED,
            function () {

                hideLoading();
                setStatus("● LIVE", true);

                video.play().catch(function () {
                    setStatus(
                        "● LIVE — Press Play",
                        true
                    );
                });
            }
        );

        hls.on(
            Hls.Events.ERROR,
            function (event, data) {

                console.log(data);

                if (data.fatal) {

                    hideLoading();

                    setStatus(
                        "● Stream Error",
                        false
                    );

                    showError(
                        "Unable to load the live stream. Try Reload."
                    );

                    if (
                        data.type ===
                        Hls.ErrorTypes.NETWORK_ERROR
                    ) {
                        hls.startLoad();
                    }

                    else if (
                        data.type ===
                        Hls.ErrorTypes.MEDIA_ERROR
                    ) {
                        hls.recoverMediaError();
                    }

                    else {
                        destroyHLS();
                    }
                }
            }
        );
    }

    /*
     * Safari / native HLS
     */
    else if (
        video.canPlayType(
            "application/vnd.apple.mpegurl"
        )
    ) {

        video.src = STREAM_URL;

        video.addEventListener(
            "loadedmetadata",
            function () {

                hideLoading();
                setStatus("● LIVE", true);

                video.play().catch(function () {
                    setStatus(
                        "● LIVE — Press Play",
                        true
                    );
                });

            },
            { once: true }
        );

    }

    else {

        hideLoading();

        setStatus(
            "● HLS Not Supported",
            false
        );

        showError(
            "Your browser does not support HLS playback."
        );
    }
}

function reloadStream() {
    playStream();
}

function fullscreen() {

    const player =
        document.getElementById("player");

    if (player.requestFullscreen) {
        player.requestFullscreen();
    }

    else if (video.webkitEnterFullscreen) {
        video.webkitEnterFullscreen();
    }

    else {
        video.play();
    }
}

video.addEventListener(
    "playing",
    function () {
        hideLoading();
        setStatus("● LIVE", true);
        clearError();
    }
);

video.addEventListener(
    "waiting",
    function () {
        setStatus("● Buffering...", false);
    }
);

video.addEventListener(
    "ended",
    function () {
        setStatus("● Stream Ended", false);
    }
);

video.addEventListener(
    "error",
    function () {
        hideLoading();
        setStatus("● Playback Error", false);
    }
);

/* Start player */
window.addEventListener(
    "load",
    playStream
);

</script>

</body>
</html>
